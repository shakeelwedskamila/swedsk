<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                 initial-scale=1.0">

    <title>Shakeel & Kamila | Wedding Invitation</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --pink-light: #fff5f7;
            --pink-soft: #fce5ea;
            --pink: #f3c5d0;
            --pink-medium: #e5a1b1;
            --pink-dark: #c15d76;
            --rose: #a84763;
            --cream: #fffaf8;
            --gold: #c59b61;
            --text: #49343a;
            --muted: #806c72;
            --dark: #38262d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--pink-light);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1,
        h2,
        h3 {
            font-family: "Cormorant Garamond", serif;
            font-weight: 500;
        }

        button,
        a {
            font-family: inherit;
        }


        /* =================================================
           INTRO
        ================================================= */

        #intro {
            position: fixed;
            inset: 0;
            z-index: 5000;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 20px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #fffefe 0%,
                    #fff2f5 55%,
                    #fbdfe6 100%
                );

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-content {
            width: 100%;
            max-width: 390px;
            position: relative;
            z-index: 10;
        }

        .intro-top {
            color: var(--pink-dark);
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }



        /* Animated rays during envelope opening */
        .light-rays {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100vmax;
            height: 100vmax;
            transform: translate(-50%, -50%) rotate(0deg);
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity .8s ease;
            background:
                conic-gradient(
                    from 0deg at 50% 50%,
                    transparent 0deg 8deg,
                    rgba(255,255,255,.46) 11deg 15deg,
                    transparent 18deg 38deg,
                    rgba(255,255,255,.30) 42deg 47deg,
                    transparent 50deg 78deg,
                    rgba(255,255,255,.38) 82deg 88deg,
                    transparent 91deg 126deg,
                    rgba(255,255,255,.28) 130deg 136deg,
                    transparent 140deg 176deg,
                    rgba(255,255,255,.42) 180deg 187deg,
                    transparent 191deg 218deg,
                    rgba(255,255,255,.28) 222deg 228deg,
                    transparent 232deg 268deg,
                    rgba(255,255,255,.38) 272deg 278deg,
                    transparent 282deg 318deg,
                    rgba(255,255,255,.34) 322deg 328deg,
                    transparent 332deg 360deg
                );
            filter: blur(1.5px);
            animation: raysSpin 8s linear infinite;
        }

        .light-rays::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center,
                rgba(255,255,255,.72) 0%,
                rgba(255,255,255,.22) 12%,
                transparent 38%
            );
        }

        #intro.opening .light-rays {
            opacity: .9;
        }

        #intro.opened .light-rays {
            opacity: 0;
            transition: opacity 1.4s ease;
        }

        @keyframes raysSpin {
            from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50%  { transform: translate(-50%, -50%) rotate(180deg) scale(1.05); }
            to   { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        /* Make the opening feel more cinematic */
        #intro.opening {
            background:
                radial-gradient(
                    circle at center,
                    #ffffff 0%,
                    #fff7f9 42%,
                    #fbdfe6 100%
                );
        }

        #intro.opening .envelope {
            filter:
                drop-shadow(0 25px 25px rgba(180,75,105,.18))
                drop-shadow(0 0 30px rgba(255,255,255,.85));
        }

        /* =================================================
           ENVELOPE
        ================================================= */

        .envelope-scene {
            position: relative;
            width: 100%;
            height: 235px;

            display: flex;
            align-items: center;
            justify-content: center;

            perspective: 1000px;
        }

        .envelope {
            position: relative;

            width: min(82vw, 320px);
            height: min(58vw, 205px);

            transform-style: preserve-3d;

            animation:
                envelopeFloat
                4s
                ease-in-out
                infinite;

            filter:
                drop-shadow(
                    0 25px 25px
                    rgba(180,75,105,.18)
                );

            transition:
                transform 1.8s
                cubic-bezier(.2,.8,.2,1),
                opacity 1s ease;
        }

        @keyframes envelopeFloat {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(.5deg);
            }
        }


        /* Envelope body */

        .envelope-body {
            position: absolute;
            inset: 0;

            z-index: 1;

            border-radius: 5px;

            background:
                linear-gradient(
                    145deg,
                    #f9dfe5,
                    #edc1cc
                );

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.7);
        }

        .envelope-body::before {
            content: "";

            position: absolute;
            inset: 0;

            background:

                linear-gradient(
                    35deg,
                    transparent 49.5%,
                    rgba(150,75,95,.14) 50%,
                    transparent 50.5%
                ),

                linear-gradient(
                    -35deg,
                    transparent 49.5%,
                    rgba(150,75,95,.14) 50%,
                    transparent 50.5%
                );
        }


        /* =================================================
           LETTER
        ================================================= */

        .letter {
            position: absolute;

            left: 50%;
            bottom: 12px;

            z-index: 0;

            width: 82%;
            height: 165px;

            transform:
                translateX(-50%)
                translateY(-20px)
                scale(.98);

            opacity: .95;

            background:
                linear-gradient(
                    145deg,
                    #fffdfb,
                    #fff5f7
                );

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 20px
                rgba(100,40,60,.12);

            border-radius: 2px;

            transition:
                transform 2.4s
                cubic-bezier(.2,.8,.2,1),
                opacity 1s ease;
        }

        .letter-small {
            color: var(--pink-dark);
            font-size: 7px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .letter-names {
            color: var(--rose);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 37px;
            line-height: 1;
        }

        .letter-date {
            margin-top: 12px;

            color: var(--muted);

            font-size: 7px;
            letter-spacing: 3px;
        }



        .letter {
            justify-content: center;
        }

        .letter-small {
            font-size: 8px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .letter-date {
            margin-top: 10px;
        }

        /* =================================================
           FLAP
        ================================================= */

        .flap {
            position: absolute;
            inset: 0;

            z-index: 5;

            background:
                linear-gradient(
                    145deg,
                    #ffeaf0,
                    #f3cad4
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 59%
                );

            transform-origin: top center;

            backface-visibility: hidden;

            transition:
                transform 2.2s
                cubic-bezier(.65,.05,.25,1);
        }


        /* =================================================
           OPEN STATE
        ================================================= */

        .envelope.open {
            animation: none;

            transform:
                translateY(20px)
                scale(1.02);
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
        }

        .envelope.open .letter {
            transform:
                translateX(-50%)
                translateY(-70px)
                scale(1);

            opacity: 1;
            z-index: 6;
        }

        .envelope.open.complete {
            transform:
                translateY(120px)
                scale(.9);

            opacity: 0;
        }


        /* =================================================
           WAX
        ================================================= */

        .wax {
            position: absolute;

            left: 50%;
            top: 52%;

            z-index: 20;

            width: 72px;
            height: 72px;

            transform:
                translate(-50%,-50%);

            border-radius: 50%;

            border: 0;
            padding: 0;
            appearance: none;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffe1e8;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 20px;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ee93aa,
                    #a93d5a
                );

            box-shadow:
                0 8px 22px
                rgba(120,35,60,.3);

            cursor: pointer;

            animation:
                sealPulse
                2s
                ease-in-out
                infinite;

            transition:
                opacity .8s ease,
                transform 1s
                cubic-bezier(.2,.8,.2,1);
        }

        @keyframes sealPulse {

            0%,100% {
                box-shadow:
                    0 8px 22px
                    rgba(120,35,60,.3),

                    0 0 0 0
                    rgba(233,140,164,0);
            }

            50% {
                box-shadow:
                    0 8px 22px
                    rgba(120,35,60,.3),

                    0 0 0 12px
                    rgba(233,140,164,.12);
            }
        }

        .wax:active {
            transform:
                translate(-50%,-50%)
                scale(.86);
        }

        .wax:focus-visible {
            outline: 3px solid var(--rose);
            outline-offset: 6px;
        }

        .wax.gone {
            opacity: 0;

            transform:
                translate(-50%,-50%)
                scale(1.8)
                rotate(20deg);

            pointer-events: none;
        }


        /* =================================================
           INTRO TITLE
        ================================================= */

        .intro-title {
            font-size:
                clamp(48px, 14vw, 62px);

            line-height: .82;

            color: var(--rose);

            margin-top: 4px;
            margin-bottom: 15px;
        }

        .intro-subtitle {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
        }


        /* =================================================
           FLOATING HEARTS
        ================================================= */

        .heart {
            position: absolute;
            z-index: 2;

            color:
                rgba(206,93,120,.55);

            font-size: 22px;

            pointer-events: none;

            animation:
                heartFloat
                ease-in-out
                infinite;
        }

        .h1 {
            left: 10%;
            top: 16%;
            animation-duration: 4s;
        }

        .h2 {
            right: 12%;
            top: 22%;
            font-size: 17px;
            animation-duration: 5s;
            animation-delay: .8s;
        }

        .h3 {
            left: 7%;
            bottom: 18%;
            font-size: 24px;
            animation-duration: 4.5s;
        }

        .h4 {
            right: 8%;
            bottom: 17%;
            font-size: 26px;
            animation-duration: 5.5s;
        }

        .h5 {
            left: 25%;
            top: 9%;
            font-size: 11px;
            animation-duration: 3.8s;
        }

        @keyframes heartFloat {

            0%,100% {
                transform:
                    translateY(0)
                    rotate(-8deg);

                opacity: .35;
            }

            50% {
                transform:
                    translateY(-18px)
                    rotate(8deg);

                opacity: .85;
            }
        }


        /* =================================================
           SPARKLES
        ================================================= */

        .sparkle {
            position: absolute;
            z-index: 2;

            color:
                rgba(194,154,98,.75);

            font-size: 16px;

            animation:
                sparkle
                2s
                ease-in-out
                infinite;

            pointer-events: none;
        }

        .s1 {
            top: 18%;
            left: 35%;
        }

        .s2 {
            top: 35%;
            right: 28%;
            animation-delay: .5s;
        }

        .s3 {
            bottom: 28%;
            left: 30%;
            animation-delay: 1s;
        }

        .s4 {
            bottom: 18%;
            right: 25%;
            animation-delay: 1.5s;
        }

        @keyframes sparkle {

            0%,100% {
                opacity: .2;

                transform:
                    scale(.7)
                    rotate(0);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.3)
                    rotate(90deg);
            }
        }


        /* =================================================
           HEART BURST
        ================================================= */

        .burst-heart {
            position: fixed;

            z-index: 9000;

            left: 50%;
            top: 50%;

            color: #e56f8c;

            font-size: 18px;

            pointer-events: none;

            animation:
                heartBurst
                1.1s
                ease-out
                forwards;
        }

        @keyframes heartBurst {

            0% {
                opacity: 1;

                transform:
                    translate(-50%,-50%)
                    scale(.4);
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.5)
                    rotate(25deg);
            }
        }


        /* =================================================
           SCRATCH PAGE
        ================================================= */

        #scratch {
            position: fixed;
            inset: 0;

            z-index: 4000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    #fffdfd,
                    #ffe7ed
                );

            opacity: 0;

            transform:
                translateY(35px)
                scale(.98);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }

        #scratch.show {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        .scratch-wrap {
            width: 100%;
            max-width: 370px;
            text-align: center;
        }

        .scratch-label {
            color: var(--pink-dark);

            font-size: 9px;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 18px;
        }

        .scratch-card {
            position: relative;

            width: 100%;

            aspect-ratio: .76;

            overflow: hidden;

            border-radius: 5px;

            background:
                radial-gradient(
                    circle at center,
                    #fffdfd,
                    #fff1f4
                );

            box-shadow:
                0 25px 70px
                rgba(170,80,105,.18);
        }

        .scratch-content {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .scratch-small {
            color: var(--pink-dark);

            font-size: 9px;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 18px;
        }

        .scratch-title {
            color: var(--rose);

            font-size:
                clamp(50px, 16vw, 72px);

            line-height: .68;
        }

        .scratch-date {
            margin-top: 28px;

            font-size: 9px;

            letter-spacing: 4px;

            color: var(--muted);
        }

        #scratchCanvas {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            touch-action: none;

            cursor: pointer;
        }


        /* =================================================
           MAIN SITE
        ================================================= */

        #site {
            opacity: 0;

            transition:
                opacity 1.2s ease;
        }

        #site.show {
            opacity: 1;
        }

        section {
            min-height: 100svh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 75px 22px;

            text-align: center;
        }


        /* =================================================
           HERO
        ================================================= */

        .hero {
            position: relative;

            min-height: 100svh;

            color: white;

            overflow: hidden;

            background:

                linear-gradient(
                    rgba(100,35,55,.25),
                    rgba(70,25,40,.55)
                ),

                url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85")
                center/cover;
        }

        .hero::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle,
                    transparent 20%,
                    rgba(40,10,20,.3)
                );
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }
